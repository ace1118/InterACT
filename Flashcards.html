<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--pd:#18283f;--pg:#848c99;--bg:#f0f1f5;--wh:#fff;--c1:#70f2f5;--c2:#02465c;--g1:#ffcc00;--g2:#ff6100;--mx:14px}
html,body{height:100%;font-family:'Poppins',sans-serif;background:linear-gradient(180deg,#ffffff,#e5eeff);color:var(--pd);overflow:hidden;-webkit-user-select:none;-moz-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text}
.app{width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.tw{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--wh);padding:12px 18px 12px 16px;border-radius:12px;font-size:.82rem;font-weight:600;display:flex;align-items:flex-start;gap:12px;max-width:400px;border:2px solid var(--g2);position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.1);animation:tIn .3s}
.toast::before{content:'';position:absolute;top:0;left:0;right:0;height:3.5px;background:linear-gradient(90deg,var(--g1),var(--g2))}
.toast.ok{border-color:#059669}.toast.ok::before{background:linear-gradient(90deg,#34d399,#059669)}
.toast-b{flex:1}.toast-b .t1{font-weight:700;color:var(--pd);font-size:.84rem}.toast-b .t2{font-weight:400;color:var(--pg);font-size:.75rem;margin-top:1px}
.toast-x{border:none;background:none;cursor:pointer;font-size:.9rem;color:var(--pg);padding:0;line-height:1;flex-shrink:0}.toast-x:hover{color:var(--pd)}
@keyframes tIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.hd{background:var(--wh);padding:6px var(--mx);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4e5e9;flex-shrink:0}
.hd-l{display:flex;align-items:baseline;gap:8px}
.l1{font-weight:800;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.l2{font-weight:400;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hd-r{display:flex;gap:6px}
.tb{padding:5px 18px;border-radius:7px;font-family:'Poppins',sans-serif;font-weight:700;font-size:.74rem;cursor:pointer;transition:all .2s;border:2px solid var(--c2);text-transform:uppercase;letter-spacing:.4px}
.tb.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--wh)}.tb:not(.on){background:transparent;color:var(--c2)}.tb:not(.on):hover{background:rgba(2,70,92,.04)}
.mn{flex:1;padding:var(--mx);overflow:hidden;min-height:0;display:flex;flex-direction:column}
.cr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;flex:1;min-height:0;overflow:hidden}
.bx{background:var(--wh);border-radius:14px;padding:18px;border:1px solid #e4e5e9;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.bx-s{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding-right:4px}
.bx-s::-webkit-scrollbar{width:4px}.bx-s::-webkit-scrollbar-thumb{background:#d0d2d8;border-radius:8px}
.bx h3{font-size:.92rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.sn{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fg{margin-bottom:12px;flex-shrink:0}
.fg label{display:block;font-size:.72rem;font-weight:600;color:var(--pg);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea{width:100%;padding:9px 12px;border:1.5px solid #d0d2d8;border-radius:8px;font-family:'Poppins',sans-serif;font-size:.84rem;color:var(--pd);outline:none;background:transparent;transition:border .2s}
.fg input:focus,.fg textarea:focus{border-color:var(--c1)}.fg input::placeholder,.fg textarea::placeholder{color:#b8bac0}
.fg textarea{resize:vertical;min-height:50px}
.tr{display:flex;gap:6px}.tr .fg{flex:1;margin-bottom:0}
.lr{display:flex;gap:5px}
.lb{flex:1;padding:8px;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.74rem;cursor:pointer;color:var(--wh);transition:all .2s}
.lb.on{opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.12)}.lb:not(.on){background:#d4d6db !important;color:#999;opacity:.85}
.bx-bt{flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #eee;margin-top:10px}
.ar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ab{padding:9px 4px;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer;color:var(--wh);transition:all .15s;text-align:center;position:relative}
.ab:hover{opacity:.88;transform:translateY(-1px)}
[data-tip]{position:relative}[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--pd);color:#fff;padding:6px 12px;border-radius:8px;font-size:.62rem;font-weight:500;white-space:normal;width:210px;text-align:center;z-index:60;pointer-events:none;animation:fadeIn .15s;line-height:1.4}[data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--pd);z-index:60;pointer-events:none;animation:fadeIn .15s}
.ts{display:flex;gap:5px;margin-bottom:12px;flex-shrink:0}
.tyb{flex:1;padding:8px;border:1.5px solid #d0d2d8;border-radius:8px;background:transparent;font-family:'Poppins',sans-serif;font-weight:600;font-size:.72rem;cursor:pointer;color:var(--pg);transition:all .2s}
.tyb.on{border-color:var(--pd);color:var(--pd);background:rgba(24,40,63,.04)}
.ui{width:100%;padding:9px 12px;border:1.5px solid #d0d2d8;border-radius:8px;font-family:'Poppins',sans-serif;font-size:.84rem;color:var(--pg);outline:none;background:transparent;cursor:pointer}.ui.hv{color:var(--pd)}.hf{display:none}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;flex-shrink:0;max-width:260px;margin:0 auto;padding:2px 0}
.cv{aspect-ratio:1;border-radius:6px;cursor:pointer;border:2.5px solid transparent;transition:all .15s;position:relative;overflow:hidden}
.cv:hover{transform:scale(1.06)}.cv.sel{border-color:var(--pd);box-shadow:0 0 0 1.5px #fff,0 0 0 3.5px var(--pd)}
.cv .pt{position:absolute;inset:0}
.pt-d{background-image:radial-gradient(circle,rgba(255,255,255,.28) 1.5px,transparent 1.5px);background-size:7px 7px}
.pt-s{background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(255,255,255,.22) 3px,rgba(255,255,255,.22) 6px)}
.pt-z{background-image:linear-gradient(135deg,rgba(255,255,255,.2) 25%,transparent 25%),linear-gradient(225deg,rgba(255,255,255,.2) 25%,transparent 25%),linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%),linear-gradient(315deg,rgba(255,255,255,.2) 25%,transparent 25%);background-size:8px 8px;background-position:4px 0,4px 0,0 0,0 0}
.pt-g{background-image:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);background-size:7px 7px}
.pt-c{background-image:radial-gradient(circle,rgba(255,255,255,.24) 1px,transparent 1px),radial-gradient(circle,rgba(255,255,255,.24) 1px,transparent 1px);background-size:9px 9px;background-position:0 0,4.5px 4.5px}
.pvs{flex-shrink:0;margin:14px 0 6px}
.pvl{font-size:.72rem;font-weight:600;color:var(--pg);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;text-align:left}
.pvr{display:flex;gap:18px;justify-content:center}
.pvw{text-align:center}
.pvc{width:125px;height:125px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex-shrink:0}
.pvcl{font-size:.62rem;color:var(--pg);margin-top:6px;font-weight:500}
.pv-cv{color:rgba(255,255,255,.45);font-size:2.2rem;font-weight:700}.pv-cv .pt{position:absolute;inset:0}
.pv-ct{background:var(--wh);border:1.5px solid #e4e5e9}
.pv-ct .xt{font-size:.88rem;font-weight:600;color:var(--pd);text-align:center;padding:10px;word-break:break-word;line-height:1.3}
.pv-ct .xe{font-size:3rem}.pv-ct .xi{max-width:90%;max-height:88%;object-fit:contain;border-radius:6px}.pv-ct .xn{font-size:.68rem;color:#c0c2c8}
.cl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:3px;min-height:0}
.cl::-webkit-scrollbar{width:4px}.cl::-webkit-scrollbar-thumb{background:#d0d2d8;border-radius:8px}
.ci{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--bg);border-radius:9px;font-size:.8rem;flex-shrink:0}.ci:hover{background:#e4e5e9}
.ci .ct{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}.ci .ct .pt{position:absolute;inset:0}
.ci .cn{flex:1;min-width:0;font-weight:600;color:var(--pd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
.ci .ca{display:flex;gap:4px;flex-shrink:0}
.ab2{border:none;border-radius:6px;cursor:pointer;font-size:.66rem;font-family:'Poppins',sans-serif;font-weight:600;padding:5px 11px;transition:all .12s}
.ab2.ed{background:rgba(112,242,245,.15);color:var(--c2)}.ab2.ed:hover{background:rgba(112,242,245,.3)}
.ab2.dl{background:rgba(229,62,62,.1);color:#e53e3e}.ab2.dl:hover{background:rgba(229,62,62,.2)}
.es{text-align:center;padding:24px 8px;color:var(--pg);font-size:.78rem}.es .ei{font-size:1.8rem;margin-bottom:5px;opacity:.35}
.cc{font-size:.66rem;color:var(--pg);font-weight:500;margin-left:auto}
.btn-p{width:100%;padding:10px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:.88rem;cursor:pointer;flex-shrink:0;transition:opacity .2s}.btn-p:hover{opacity:.88}.btn-p:disabled{opacity:.3;cursor:not-allowed}

/* PLAY */
.pp{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.pb{background:linear-gradient(180deg,#e8e9ed,#d8d9dd);border-radius:12px 12px 0 0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pb-l{display:flex;flex-direction:column;gap:1px}.pb-l .p-t{font-size:1.05rem;font-weight:800}.pb-l .p-d{font-size:.72rem;color:var(--pg)}
.pb-r{display:flex;gap:18px;align-items:flex-end}
.ps{text-align:center;min-width:52px}.ps .pl{font-size:.56rem;color:var(--pg);text-transform:uppercase;letter-spacing:.4px;font-weight:600}.ps .pv{font-size:1.5rem;font-weight:800;color:var(--pd);line-height:1.1;font-variant-numeric:tabular-nums}
.ptm{text-align:center;min-width:70px}.ptm .pl{font-size:.56rem;color:var(--pg);text-transform:uppercase;letter-spacing:.4px;font-weight:600}.ptm .pv{font-size:1.8rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.tg{color:#22c55e}.ty{color:#eab308}.tre{color:#ef4444}
.prg{height:4px;flex-shrink:0;background:#e0e0e0}.prg-f{height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .4s}
.ga{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px;overflow:hidden;background:#ffffff;border-radius:0 0 12px 12px;border:1px solid #e4e5e9;border-top:none;min-height:0;position:relative}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.particle{position:absolute;border-radius:50%;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{0%{opacity:0;transform:translateY(100%) scale(.5)}10%{opacity:.09}50%{opacity:.06}100%{opacity:0;transform:translateY(-120vh) scale(1)}}

/* GAME GRID — position:relative cells, absolutely-positioned card inners */
.gg-wrap{display:flex;align-items:center;justify-content:center;flex:1;width:100%;min-height:0;position:relative;z-index:1}
.gg{display:inline-grid;gap:10px}
/* Each cell is a positioned container with fixed dimensions */
.gc{position:relative;overflow:visible}
/* The flippable card fills the cell exactly */
.gc-inner{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer}
.gc.flipped .gc-inner,.gc.matched .gc-inner{transform:rotateY(180deg)}
.gc-front,.gc-back{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gc-front{border:2px solid rgba(0,0,0,.08);color:rgba(255,255,255,.45);font-weight:700}.gc-front .pt{position:absolute;inset:0}
.gc-back{background:var(--wh);border:2px solid #dde0e6;transform:rotateY(180deg);padding:4px}
.gc-back .card-content{display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-align:center;font-weight:600;color:var(--pd);word-break:break-word;overflow:hidden}
.gc-back .card-content img{max-width:92%;max-height:92%;object-fit:contain;border-radius:5px;display:block}
.gc.matched .gc-back{border-color:var(--g1);background:linear-gradient(135deg,rgba(251,175,1,.06),rgba(255,204,0,.06))}
.gc.matched{pointer-events:none}
.gc.placeholder{visibility:hidden;pointer-events:none}

.btn-rs{padding:9px 28px;border:none;border-radius:9px;background:linear-gradient(135deg,#faad91,#ff1111);color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:.84rem;cursor:pointer;margin-top:14px;transition:opacity .2s;flex-shrink:0;display:flex;align-items:center;gap:6px;z-index:2}.btn-rs:hover{opacity:.88}.btn-rs svg{width:16px;height:16px}
.nc{text-align:center;padding:40px;color:var(--pg);margin:auto;z-index:2}.nc .ni{font-size:2.5rem;margin-bottom:8px;opacity:.3}.nc p{font-size:.85rem}.nc .nh{font-size:.72rem;margin-top:5px}

.mo{position:fixed;inset:0;background:rgba(24,40,63,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s}.mo.z3{z-index:300}
.mm{background:var(--wh);border-radius:16px;padding:26px;max-width:400px;width:92%;animation:scaleIn .25s cubic-bezier(.2,.8,.3,1)}
.mm h3{font-size:.95rem;font-weight:700;margin-bottom:14px}.mm p{font-size:.82rem;color:var(--pg);margin-bottom:14px;line-height:1.5}.mm .hn{font-weight:700;color:var(--pd)}
.ma{display:flex;gap:8px;margin-top:14px}.ma button{flex:1;padding:9px;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;transition:all .12s}
.bc{border:1.5px solid #d0d2d8;background:transparent;color:var(--pg)}.bc:hover{background:var(--bg)}.bs{border:none;background:var(--pd);color:#fff}.bs:hover{opacity:.9}.bd{border:none;background:#e53e3e;color:#fff}.bd:hover{opacity:.9}
.wm{background:var(--wh);border-radius:20px;padding:34px 30px;text-align:center;max-width:400px;width:92%;animation:scaleIn .3s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden}
.wm .wi{font-size:2.8rem;margin-bottom:6px;position:relative;z-index:2}.wm h2{font-size:1.25rem;font-weight:800;margin-bottom:4px;position:relative;z-index:2}
.wm .wfb{font-size:.8rem;color:var(--pg);margin:4px 0 16px;font-style:italic;position:relative;z-index:2}
.wm .wsg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;position:relative;z-index:2}
.wm .ws-item{background:var(--bg);border-radius:10px;padding:10px 8px}.wm .ws-item .wv{font-size:1.35rem;font-weight:800;color:var(--g2);line-height:1.2}.wm .ws-item .wl{font-size:.6rem;color:var(--pg);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.wm button{padding:10px 30px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:.88rem;cursor:pointer;position:relative;z-index:2}.wm button:hover{opacity:.88}
.confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.confetti-piece{position:absolute;top:-10px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}100%{opacity:0;transform:translateY(450px) rotate(720deg) scale(.5)}}
.em{background:var(--wh);border-radius:16px;padding:22px;max-width:580px;width:96%;max-height:78vh;display:flex;flex-direction:column;animation:scaleIn .2s cubic-bezier(.2,.8,.3,1)}
.em h3{font-size:.95rem;font-weight:700;margin-bottom:10px}
.ems{width:100%;padding:9px 12px;border:1.5px solid #d0d2d8;border-radius:8px;font-family:'Poppins',sans-serif;font-size:.82rem;margin-bottom:10px;outline:none;background:transparent;flex-shrink:0}.ems:focus{border-color:var(--c1)}
.emg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;overflow-y:auto;overflow-x:hidden;padding:4px;flex:1;min-height:0}
.emg::-webkit-scrollbar{width:5px}.emg::-webkit-scrollbar-thumb{background:#d0d2d8;border-radius:8px}
.emb{border:none;border-radius:8px;background:var(--bg);font-size:1.5rem;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;height:44px;line-height:1;overflow:hidden}.emb:hover{background:#dce0ea;transform:scale(1.06)}
.emc{margin-top:10px;width:100%;padding:8px;border:1.5px solid #d0d2d8;border-radius:8px;background:transparent;font-family:'Poppins',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--pg);flex-shrink:0}
.ll{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.ll::-webkit-scrollbar{width:4px}.ll::-webkit-scrollbar-thumb{background:#d0d2d8;border-radius:8px}
.lli{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-radius:9px;transition:all .12s}
.lli .ln{flex:1;min-width:0}.lli .ln .lt{font-weight:600;font-size:.82rem;color:var(--pd)}.lli .ln .ld{font-size:.66rem;color:var(--pg)}
.lli .la{display:flex;gap:4px;flex-shrink:0}.lli .la button{border:none;border-radius:6px;padding:5px 10px;font-size:.64rem;font-family:'Poppins',sans-serif;font-weight:600;cursor:pointer}
.lli .la .lb-load{background:rgba(112,242,245,.15);color:var(--c2)}.lli .la .lb-load:hover{background:rgba(112,242,245,.3)}
.lli .la .lb-del{background:rgba(229,62,62,.1);color:#e53e3e}.lli .la .lb-del:hover{background:rgba(229,62,62,.2)}
.le{text-align:center;padding:24px;color:var(--pg);font-size:.78rem}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@media(max-width:960px){.cr{grid-template-columns:1fr;gap:8px;overflow-y:auto}.bx{min-height:auto;max-height:none;overflow:visible}}
@media(max-width:600px){:root{--mx:8px}.l1{font-size:1.05rem}.l2{font-size:.9rem}.tb{padding:4px 12px;font-size:.7rem}}
/* emoji category tabs (added to match latest picker, early-version styling) */
.emo-cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;flex-shrink:0}
.emo-cat{padding:5px 10px;border:1.5px solid #d0d2d8;border-radius:8px;background:transparent;font-size:.9rem;cursor:pointer;transition:all .12s;font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:3px}
.emo-cat span.cat-label{font-size:.58rem;font-weight:600;color:var(--pg)}
.emo-cat:hover{border-color:#b9bcc4}
.emo-cat.on{background:rgba(24,40,63,.04);border-color:var(--pd)}
.emo-cat.on span.cat-label{color:var(--pd)}

/* —— gameplay juice: combo + sound + match/miss feedback (in-theme) —— */
.snd-tg{position:absolute;top:12px;right:14px;z-index:3;width:34px;height:34px;border:1.5px solid #e4e5e9;border-radius:9px;background:rgba(255,255,255,.85);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.snd-tg:hover{border-color:var(--c1);transform:translateY(-1px)}
.snd-tg:active{transform:scale(.94)}

const[curLibId,setCurLibId]=useState(null);
const[title,setTitle]=useState("Flashcard Deck");const[dirs,setDirs]=useState("Read each card, then choose the matching answer below.");const[tmn,setTmn]=useState("");const[tsc,setTsc]=useState("");const[pts,setPts]=useState("");const[sc,setSc]=useState(0);

const[bFType,setBFType]=useState("text");const[bFText,setBFText]=useState("");const[bFImg,setBFImg]=useState("");const[bFEmo,setBFEmo]=useState("");
const _o0=newPid(),_o1=newPid();const[bOpts,setBOpts]=useState([{id:_o0,type:"text",text:"",img:"",emo:""},{id:_o1,type:"text",text:"",img:"",emo:""}]);const[bCorrect,setBCorrect]=useState("");
const[showE,setShowE]=useState(false);const[eS,setES]=useState("");const[emoFor,setEmoFor]=useState("front");
const[editIdx,setEditIdx]=useState(-1);const[didx,setDidx]=useState(null);
const[maskWords,setMaskWords]=useState(true);
const hydratedRef=useRef(false);
/* play */
const[gOn,setGOn]=useState(false);
const[order,setOrder]=useState([]);const orderRef=useRef([]);
const[cur,setCur]=useState(0);const curRef=useRef(0);
const[seen,setSeen]=useState(new Set());const seenRef=useRef(new Set());
const[quizOpts,setQuizOpts]=useState({});const quizRef=useRef({});
const[wrong,setWrong]=useState({});const wrongRef=useRef({});
const firstRef=useRef(new Set());
const[tm,setTm]=useState(0);
const[showComp,setShowComp]=useState(false);const compRef=useRef(false);
const[muted,setMuted]=useState(false);const acRef=useRef(null);
const stageRef=useRef(null);const[stageW,setStageW]=useState(700);const[stageH,setStageH]=useState(440);
/* modals + persistence */
const[showSv,setShowSv]=useState(false);const[svT,setSvT]=useState("");const[svD,setSvD]=useState("");
const[showLd,setShowLd]=useState(false);const[ldL,setLdL]=useState([]);const[delSavId,setDelSavId]=useState(null);
const[showCl,setShowCl]=useState(false);const[toasts,setToasts]=useState([]);

const toast=(m,s,tp="warn")=>{const id=Date.now()+Math.random();setToasts(p=>[...p,{id,m,s,tp}]);setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==id)),5000)};
const kT=id=>setToasts(p=>p.filter(x=>x.id!==id));

useEffect(()=>{curRef.current=cur},[cur]);
useEffect(()=>{seenRef.current=seen},[seen]);
useEffect(()=>{const el=stageRef.current;if(!el||typeof ResizeObserver==="undefined")return;const ro=new ResizeObserver(es=>{for(const e of es){setStageW(e.contentRect.width);setStageH(e.contentRect.height)}});ro.observe(el);setStageW(el.clientWidth);setStageH(el.clientHeight);return()=>ro.disconnect()},[tab,gOn,order.length]);

const getAC=()=>{if(!acRef.current){try{acRef.current=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}const ac=acRef.current;if(ac&&ac.state==="suspended"){try{ac.resume()}catch(e){}}return acRef.current};
const beep=(freq,dur,type,vol,when)=>{if(muted)return;const ac=getAC();if(!ac)return;const tt=ac.currentTime+(when||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.setValueAtTime(freq,tt);o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.0001,tt);g.gain.exponentialRampToValueAtTime(vol||0.14,tt+0.012);g.gain.exponentialRampToValueAtTime(0.0001,tt+dur);o.start(tt);o.stop(tt+dur+0.03)};
const sFlip=()=>{beep(523,0.07,"sine",0.09);beep(784,0.08,"sine",0.07,0.05)};
const sCorrect=()=>{[523.25,659.25,783.99].forEach((f,i)=>beep(f,0.16,"sine",0.15,i*0.07))};

/* card sizing */
const cardDims=useMemo(()=>{const W=Math.max(220,stageW),H=Math.max(180,stageH);let cw=Math.min(W*0.64,600);cw=Math.max(240,cw);let ch=cw*0.62;const maxH=H*0.9;if(ch>maxH){ch=maxH;cw=ch/0.62}if(cw>W*0.82){cw=W*0.82;ch=cw*0.62}return{cw,ch,sp:cw*0.6}},[stageW,stageH]);

/* play flow */
const buildOpts=()=>{const map={};cards.forEach((c)=>{const opts=(c.options||[]).map(o=>({side:o,correct:o.id===c.correctId,key:o.id}));for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=opts[i];opts[i]=opts[j];opts[j]=t}map[c.pid]=opts});return map};
const startG=useCallback((shuffle)=>{if(cards.length<1){toast("Add a Card","Create at least one flashcard before studying.");return}let ord=cards.map((_,i)=>i);if(shuffle){for(let k=ord.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));const tmp=ord[k];ord[k]=ord[j];ord[j]=tmp}}orderRef.current=ord;setOrder(ord);setCur(0);curRef.current=0;const mp=buildOpts();quizRef.current=mp;setQuizOpts(mp);wrongRef.current={};setWrong({});firstRef.current=new Set();const ns=new Set();seenRef.current=ns;setSeen(ns);compRef.current=false;setShowComp(false);setSc(0);setTm(0);setGOn(true);if(tR.current)clearInterval(tR.current);tR.current=setInterval(()=>setTm(x=>x+1),1000)},[cards]);
const endStudy=()=>{compRef.current=true;sWin();if(tR.current)clearInterval(tR.current);setTimeout(()=>setShowComp(true),500)};
useEffect(()=>{if(tab==="play"&&gOn&&hasTL&&tm>=totTL&&!compRef.current){endStudy()}},[tm,gOn,tab,hasTL,totTL]);
const markSeen=(id)=>{if(seenRef.current.has(id))return;const ns=new Set(seenRef.current);ns.add(id);seenRef.current=ns;setSeen(ns);if(ns.size===cards.length&&!compRef.current)setTimeout(()=>endStudy(),900)};
const gotoCard=(pos)=>{const n=orderRef.current.length;if(n===0)return;let np=((pos%n)+n)%n;curRef.current=np;setCur(np);sMove()};
const prevCard=()=>gotoCard(curRef.current-1);
const nextCard=()=>gotoCard(curRef.current+1);
const nextUnsolved=()=>{const n=orderRef.current.length;for(let st=1;st<=n;st++){const p=(curRef.current+st)%n;if(!seenRef.current.has(cards[orderRef.current[p]].pid)){gotoCard(p);return}}};
const shuffleCards=()=>{let ord=[...orderRef.current];for(let k=ord.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));const tmp=ord[k];ord[k]=ord[j];ord[j]=tmp}orderRef.current=ord;setOrder(ord);setCur(0);curRef.current=0;sShuf()};
const restartCards=()=>{startG(false)};
const onCardClick=(pos)=>{if(pos!==curRef.current)gotoCard(pos)};
const onOption=(pid,idx)=>{if(seenRef.current.has(pid))return;const opt=(quizRef.current[pid]||[])[idx];if(!opt)return;if(opt.correct){const hadWrong=!!(wrongRef.current[pid]&&wrongRef.current[pid].length>0);if(!hadWrong)firstRef.current.add(pid);sCorrect();setSc(x=>x+ppw);markSeen(pid);setTimeout(()=>{if(seenRef.current.size<cards.length)nextUnsolved()},950)}else{const cw=wrongRef.current[pid]?wrongRef.current[pid].slice():[];if(!cw.includes(idx))cw.push(idx);const nw=Object.assign({},wrongRef.current,{[pid]:cw});wrongRef.current=nw;setWrong(nw);sMiss()}};

useEffect(()=>{if(tab!=="play"||!gOn)return;const onKey=(e)=>{if(e.key==="ArrowLeft"){prevCard()}else if(e.key==="ArrowRight"){nextCard()}else if(/^[1-9]$/.test(e.key)){const cc=cards[orderRef.current[curRef.current]];if(cc){const i=parseInt(e.key)-1;if((quizRef.current[cc.pid]||[])[i])onOption(cc.pid,i)}}};window.addEventListener("keydown",onKey);return()=>window.removeEventListener("keydown",onKey)},[tab,gOn]);
useEffect(()=>()=>{if(tR.current)clearInterval(tR.current)},[]);

/* derived */
const reviewedN=seen.size;

const hasTL=(parseInt(tmn)||0)>0||(parseInt(tsc)||0)>0;const totTL=(parseInt(tmn)||0)*60+(parseInt(tsc)||0);const ppw=parseInt(pts)||0;const rem=hasTL?Math.max(0,totTL-tm):null;const tmColor=()=>{if(!hasTL)return"var(--pd)";const r=rem/totTL;if(r>.5)return"#22c55e";if(r>.2)return"#f59e0b";return"#e11d48"};

/* create handlers */
const resizeImg=(file,cb)=>{const rd=new FileReader();rd.onload=ev=>{const im=new Image();im.onload=()=>{const max=760;let w=im.width,h=im.height;if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(im,0,0,w,h);let data;try{data=cv.toDataURL("image/jpeg",0.85)}catch(_){data=ev.target.result}cb(data)};im.onerror=()=>cb(ev.target.result);im.src=ev.target.result};rd.readAsDataURL(file)};

const makeOption=(o)=>o.type==="image"?{id:o.id,type:"image",img:o.img,text:""}:o.type==="emoji"?{id:o.id,type:"emoji",text:o.emo,img:""}:{id:o.id,type:"text",text:(o.text||"").trim(),img:""};

const buildCard=(pid)=>{const valid=bOpts.filter(validOpt);if(!validSide(bFType,bFText,bFImg,bFEmo)){toast("Question Needed","Add a question/prompt for the front.");return null}if(valid.length<2){toast("Need Options","Add at least two answer options.");return null}if(!bCorrect||!valid.some(o=>o.id===bCorrect)){toast("Select the Correct Answer","Tap “Mark correct” on the option that is the right answer before adding the card.");return null}return{pid,front:makeSide(bFType,bFText,bFImg,bFEmo),options:valid.map(makeOption),correctId:bCorrect}};

const saveEdit=()=>{const card=buildCard(cards[editIdx]?cards[editIdx].pid:newPid());if(!card)return;setCards(c=>c.map((x,k)=>k===editIdx?card:x));resetBuilder();toast("Card Updated ✓","Your changes were saved.","ok")};
const delCard=()=>{const i=didx;setCards(c=>c.filter((_,k)=>k!==i));if(editIdx===i)resetBuilder();setDidx(null);toast("Card Removed","The card was deleted.","ok")};
const playFC=()=>{if(cards.length<1){toast("No Cards Yet","Add at least one card in Create before studying.");return}setTab("play");setTimeout(()=>startG(false),100)};

/* persistence */
const saveFile=async()=>{const dataObj={_sig:FILE_SIG,title,dirs,lang,tmn,tsc,pts,cards};const dataStr=JSON.stringify(dataObj);const suggested=`${title||"Activity"} Flashcards.ifc`;const accept={"application/json":[".ifc"]};
  if(inIframe){try{if(fileHandle&&typeof fileHandle==="string"){const r=await __post("writeHandle",{handleRef:fileHandle,content:dataStr});if(r.ok){toast("File Saved ✓",`"${fileName||"Activity"}" updated on disk.`,"ok");return}if(r.error==="permission_denied"){toast("Permission Lost","Choose the file again.");setFileHandle(null);setFileName("")}else{toast("Save Failed",r.error||"Could not write file.")}return}const rs=await __post("pickSave",{suggestedName:suggested,accept,description:"InterACT Activity",content:dataStr});if(rs.ok){if(rs.handleRef){setFileHandle(rs.handleRef);setFileName(rs.name||"")}toast("File Saved ✓",rs.fallback?"Activity downloaded as .ifc file.":`Saved as "${rs.name||"activity"}".`,"ok")}else if(rs.error!=="aborted"){toast("Save Failed",rs.error||"Could not save.")}return}catch(e){toast("Save Failed",(e&&e.message)||"Could not save.");return}}
  if(fileHandle&&typeof fileHandle==="object"&&fsaSupported()){try{const w=await fileHandle.createWritable();await w.write(dataStr);await w.close();toast("File Saved ✓",`"${fileName||title||"Activity"}" updated on disk.`,"ok");return}catch(e){if(e&&e.name==="NotAllowedError"){toast("Permission Lost","Choose the file again to keep saving.");setFileHandle(null);setFileName("")}else if(e&&e.name!=="AbortError"){toast("Save Failed",e.message||"Could not write file.")}return}}
  if(fsaSupported()){try{const h=await window.showSaveFilePicker({suggestedName:suggested,types:[{description:"InterACT Activity",accept}]});const w=await h.createWritable();await w.write(dataStr);await w.close();setFileHandle(h);setFileName(h.name||"");toast("File Saved ✓",`Saved as "${h.name||"activity"}".`,"ok");return}catch(e){if(e&&e.name==="AbortError")return;toast("Save Failed",e.message||"Could not save.");return}}
  const b=new Blob([dataStr],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=suggested;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("File Saved ✓","Activity downloaded as .ifc file.","ok")};
const openFile=async()=>{const accept={"application/json":[".ifc"]};const apply=(d,nm)=>{if(d._sig!==FILE_SIG){toast("Unsupported File","This file isn't a Flashcards activity.");return false}setTitle(d.title||"");setDirs(d.dirs||"");if(d.lang)setLang(d.lang);setTmn(d.tmn||"");setTsc(d.tsc||"");setPts(d.pts||"");if(d.cards)setCards(normalizeCards(d.cards));setCurLibId(null);toast("File Loaded ✓",`"${d.title||nm||"Activity"}" loaded. Review and Play when ready.`,"ok");return true};
  if(inIframe){try{const r=await __post("pickOpen",{accept,description:"InterACT Activity"});if(!r.ok){if(r.error!=="aborted")toast("Open Failed",r.error||"Could not open file.");return}try{const d=JSON.parse(r.content);if(apply(d,r.name)){if(r.handleRef){setFileHandle(r.handleRef);setFileName(r.name||"")}else{setFileHandle(null);setFileName("")}}}catch{toast("Invalid File","The file appears to be corrupted.")}return}catch(e){toast("Open Failed",(e&&e.message)||"Could not open file.");return}}

  const inp=document.createElement("input");inp.type="file";inp.accept=".ifc";inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{apply(JSON.parse(ev.target.result),f.name)}catch{toast("Invalid File","The file appears to be corrupted.")}};r.readAsText(f)};inp.click()};

const ldAct=d=>{setTitle(d.title||"");setDirs(d.dirs||"");if(d.lang)setLang(d.lang);setTmn(d.tmn||"");setTsc(d.tsc||"");setPts(d.pts||"");if(d.cards)setCards(normalizeCards(d.cards));setFileHandle(null);setFileName("");setShowLd(false);toast("Activity Loaded ✓","All cards and settings restored. Ready to study or edit!","ok")};

useEffect(()=>{const apply=(p)=>{if(!p)return;if(p.id!=null)setCurLibId(p.id);const d=p.data||{};if(p.mode==="edit"||p.mode==="play"){setTitle(d.title||p.title||"");setDirs(d.dirs||"");if(d.lang)setLang(d.lang);setTmn(d.tmn||"");setTsc(d.tsc||"");setPts(d.pts||"");if(d.cards)setCards(normalizeCards(d.cards));setFileHandle(null);setFileName("");setSvT(p.title||d.title||"");setSvD(p.detail||"");if(p.mode==="play"){setTab("play");setTimeout(()=>startG(false),200)}else{setTab("create");toast("Activity Loaded","\""+(p.title||d.title||"Activity")+"\" ready to edit.","ok")}}};const onInit=(e)=>apply(e.detail);window.addEventListener("interact:init",onInit);if(window.__interactInit)apply(window.__interactInit);try{window.parent.postMessage({_target:"interact_host",action:"ready"},"*")}catch(e){}return()=>window.removeEventListener("interact:init",onInit)},[]);

const SideEditor=()=>{const type=bFType,setType=setBFType,text=bFText,setText=setBFText,img=bFImg,setImg=setBFImg,emo=bFEmo;const fid="fcF";const onImg=onFImg;return(

{type==="text"&&<div className="fg"><input value={text} onChange={e=>setText(e.target.value)} placeholder="Enter the question / prompt..." onKeyDown={e=>{if(e.key==="Enter"){editIdx>=0?saveEdit():addCard()}}}/></div>}
{type==="image"&&<div className="fg"><input id={fid} type="file" accept="image/*" className="hf" onChange={onImg}/><div className={`ui ${img?"hv":""}`} onClick={()=>{if(!img)document.getElementById(fid).click()}}>{img?<span className="fc-ui-thumb"><img src={img} alt=""/>Image selected<button className="fc-ui-x" onClick={e=>{e.stopPropagation();setImg("")}}>✕</button></span>:"Click to upload image..."}</div></div>}
{type==="emoji"&&<div className="fg"><div className={`ui ${emo?"hv":""}`} onClick={()=>{setEmoFor("front");setShowE(true)}}>{emo?<span className="fc-ui-thumb"><span className="fc-ui-emoji">{emo}</span>Emoji selected — tap to change</span>:"Click to pick an emoji..."}</div></div>}
</div>);};

{o.type==="text"&&<input className="fc-optinput" value={o.text} onChange={e=>setOptField(o.id,"text",e.target.value)} placeholder={"Option "+(idx+1)+"..."} onKeyDown={e=>{if(e.key==="Enter"){editIdx>=0?saveEdit():addCard()}}}/>}
{o.type==="image"&&<><input id={oid} type="file" accept="image/*" className="hf" onChange={e=>onOptImg(o.id,e)}/><div className={`ui ${o.img?"hv":""}`} onClick={()=>{if(!o.img)document.getElementById(oid).click()}}>{o.img?<span className="fc-ui-thumb"><img src={o.img} alt=""/>Image<button className="fc-ui-x" onClick={e=>{e.stopPropagation();setOptField(o.id,"img","")}}>✕</button></span>:"Click to upload image..."}</div></>}
{o.type==="emoji"&&<div className={`ui ${o.emo?"hv":""}`} onClick={()=>{setEmoFor("opt:"+o.id);setShowE(true)}}>{o.emo?<span className="fc-ui-thumb"><span className="fc-ui-emoji">{o.emo}</span>Emoji selected — tap to change</span>:"Click to pick an emoji..."}</div>}
</div>);};
const sidePrev=(s,masked)=>{if(masked)return <span className="fc-li-mask">❓</span>;if(s.type==="image"&&s.img)return <><img src={s.img} alt=""/><span>Image</span></>;if(s.type==="emoji")return <span className="fc-li-emoji">{s.text}</span>;return <span>{s.text||"—"}</span>};
const fitFont=(txt)=>{const len=Math.max(1,((txt||"")+"").length);const padX=30,padTB=76,lh=1.26;const aw=Math.max(60,cardDims.cw-2*padX);const ah=Math.max(60,cardDims.ch-padTB);let f=Math.sqrt((aw*ah*0.55)/(0.57*lh*len));return Math.max(12,Math.min(f,46))};

const optContent=(s)=>s.type==="image"&&s.img?<img src={s.img} alt=""/>:s.type==="emoji"?<span className="fc-opt-emoji">{s.text}</span>:<span>{s.text}</span>;

return(
<div className="app" onContextMenu={e=>e.preventDefault()}>
<div className="tw">{toasts.map(x=><div key={x.id} className={`toast ${x.tp==="ok"?"ok":""}`}><div className="toast-b"><div className="t1">{x.m}</div>{x.s&&<div className="t2">{x.s}</div>}</div><button className="toast-x" onClick={()=>kT(x.id)}>✕</button></div>)}</div>
<header className="hd"><div className="hd-l"><span className="l1">FLASH</span><span className="l2">CARDS</span></div><div className="hd-r"><button className={`tb ${tab==="create"?"on":""}`} onClick={()=>setTab("create")}>Create</button><button className={`tb ${tab==="play"?"on":""}`} onClick={()=>setTab("play")}>Play</button></div></header>
<div className="mn">
{tab==="create"?(<div className="cr">
<div className="bx"><div className="bx-s">
<h3><span className="sn">1</span>Activity Setup</h3>
<div className="fg"><label>Activity Title</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Enter deck title..."/></div>
<div className="fg"><label>Directions</label><textarea value={dirs} onChange={e=>setDirs(e.target.value)} placeholder="Enter directions..."/></div>
<div className="fg"><label>Time Limit (Optional)</label><div className="tr"><div className="fg"><input type="number" min="0" max="59" value={tmn} onChange={e=>setTmn(e.target.value)} placeholder="Min"/></div><div className="fg"><input type="number" min="0" max="59" value={tsc} onChange={e=>setTsc(e.target.value)} placeholder="Sec"/></div></div></div>
<div className="fg"><label>Points per Item (Optional)</label><input type="number" min="0" value={pts} onChange={e=>setPts(e.target.value)} placeholder="e.g. 10"/></div>
<div className="fg"><label>Language</label><div className="lr"><button className={`lb ${lang==="en"?"on":""}`} style={lang==="en"?{background:"linear-gradient(135deg,#a5d3fc,#2a98fa)"}:{}} onClick={()=>setLang("en")}>🇺🇸 English</button><button className={`lb ${lang==="fil"?"on":""}`} style={lang==="fil"?{background:"linear-gradient(135deg,#a5d3fc,#2a98fa)"}:{}} onClick={()=>setLang("fil")}>🇵🇭 Filipino</button></div></div>
</div><div className="bx-bt">
<div className="ar"><button className="ab" style={{background:"linear-gradient(135deg,#90fffb,#00ada6)"}} data-tip={fileHandle?`Save changes to ${fileName}`:"Save your work as a file on your computer to share, edit, or play later."} onClick={saveFile}>{saveBtnLabel()}</button><button className="ab" style={{background:"linear-gradient(135deg,#9bc1ff,#0751cb)"}} data-tip="Open an activity file that you previously saved on this computer." onClick={openFile}>📂 Open File</button></div>
<div className="ar"><button className="ab" style={{background:"linear-gradient(135deg,#cab3e9,#842efa)"}} data-tip="Quickly save your progress inside InterACT so you can continue later." onClick={()=>{setSvT(title);setShowSv(true)}}>📥 Save Activity</button><button className="ab" style={{background:"linear-gradient(135deg,#73ff67,#00b322)"}} data-tip="Restore the last project you were working on InterACT." onClick={oLoad}>📤 Load Activity</button></div>
<button className="ab" style={{background:"linear-gradient(135deg,#faad91,#ff1111)",width:"100%"}} onClick={()=>setShowCl(true)}>🗑 Clear All</button>
</div></div>
<div className="bx"><div className="bx-s">
<h3><span className="sn">2</span>{editIdx>=0?("Edit Card "+(editIdx+1)):"Add a Card"}</h3>
{SideEditor()}
<div className="fc-side b" style={{margin:"4px 0 0"}}><div className="fc-side-h" style={{marginBottom:"6px"}}><span className="fc-side-dot"/>Back<span className="fc-side-sub">— The Answer</span></div></div>
<div className="fc-opthint">Add choices, then mark the correct one.</div>
{bOpts.map((o,idx)=>OptionEditor(o,idx))}
{bOpts.length<6&&<button className="fc-addopt" onClick={addOptionRow}>+ Add Option</button>}
</div><div className="bx-bt">{editIdx>=0?<div style={{display:"flex",gap:"8px",width:"100%"}}><button className="ab" style={{background:"linear-gradient(135deg,#34d399,#059669)",flex:"1"}} onClick={saveEdit}>✓ Update Card</button><button className="ab2" style={{flex:"0 0 auto",padding:"0 18px"}} onClick={resetBuilder}>Cancel</button></div>:<button className="ab" style={{background:"linear-gradient(135deg,var(--c1),var(--c2))",width:"100%"}} onClick={addCard}>+ Add Card</button>}</div></div>
<div className="bx">
<h3><span className="sn">3</span>Cards<button className="mask-tg" onClick={()=>setMaskWords(m=>!m)} title={maskWords?"Show backs":"Hide backs"}>{maskWords?"🙈 Hidden":"👁️ Shown"}</button><span className="cc" style={{marginLeft:8}}>{cards.length}/20</span></h3>
<div className="cl">{cards.length===0?<div className="es"><div className="ei">🃏</div><p>No cards yet.<br/>Add a question and its answer options!</p></div>:cards.map((c,i)=>{const corr=(c.options||[]).find(o=>o.id===c.correctId)||{type:"text",text:"—"};return <div className={`ci seq-ci${editIdx===i?" editing":""}`} key={c.pid}><div className="fc-li"><div className="fc-li-side">{sidePrev(c.front,false)}</div><span className="fc-li-link">→</span><div className="fc-li-side">{sidePrev(corr,maskWords)}</div><span className="fc-li-count">{(c.options||[]).length} opts</span></div><div className="ca seq-ca"><button className="seq-mv seq-edit" onClick={()=>startEdit(i)} title="Edit card">✏️</button><button className="ab2 dl" onClick={()=>setDidx(i)}>✕</button></div></div>;})}</div>
<div className="bx-bt"><button className="btn-p" onClick={playFC} disabled={cards.length<1}>▶ Play Activity</button></div>
</div></div>):
(<div className="pp">{cards.length<1?<div className="nc"><div className="ni">🃏</div><p>No cards to study yet!</p><p className="nh">Switch to <strong>CREATE</strong> and add at least one card.</p></div>:(
<><div className="pb"><div className="pb-l"><div className="p-t">{title}</div><div className="p-d">{dirs}</div></div>
<div className="pb-r">
<div className="ps"><div className="pl">{t.card}</div><div className="pv">{Math.min(cur+1,cards.length)}/{cards.length}</div></div>
<div className="ps"><div className="pl">{t.solved}</div><div className="pv">{reviewedN}/{cards.length}</div></div>
{ppw>0&&<div className="ps"><div className="pl">{t.score}</div><div className="pv">{sc}</div></div>}
{hasTL&&<div className="ptm"><div className="pl">{t.timeLeft}</div><div className="pv" style={{color:tmColor()}}>{fmt(rem)}</div></div>}
</div></div>
<div className="prg"><div className="prg-f" style={{width:`${prog}%`}}/></div>
<div className="ga"><Particles/><button className="snd-tg" onClick={()=>setMuted(m=>!m)} title={muted?"Sound off":"Sound on"}>{muted?"🔇":"🔊"}</button>
{order.length===0?<button className="btn-rs" onClick={()=>startG(false)} style={{background:"linear-gradient(135deg,var(--c1),var(--c2))",fontSize:".92rem",padding:"12px 42px",zIndex:2}}>🃏 {t.start}</button>:(
<><div className="fc-play">
<div className="fc-stage" ref={stageRef}>
{order.map((cardIdx,pos)=>{const c=cards[cardIdx];if(!c)return null;const off=pos-cur;const ab=Math.abs(off);if(ab>2)return null;const sc=ab===0?1:ab===1?0.84:0.68;const op=ab===0?1:ab===1?0.55:0.26;const bl=ab===0?0:ab===1?3:5;const solved=seen.has(c.pid);const st={width:cardDims.cw+"px",height:cardDims.ch+"px",transform:`translate(-50%,-50%) translateX(${off*cardDims.sp}px) scale(${sc})`,opacity:op,zIndex:20-ab,filter:bl?`blur(${bl}px)`:"none",pointerEvents:ab>1?"none":"auto"};return(
<div key={c.pid} className={`fc-card${solved?" flip":""}`} style={st} onClick={()=>onCardClick(pos)}>
<div className="fc-inner">
<div className="fc-face fc-front"><span className="fc-tag">{t.front}</span>{faceContent(c.front)}</div>
<div className="fc-face fc-back"><span className="fc-tag">{t.back}</span>{faceContent((c.options||[]).find(o=>o.id===c.correctId)||{type:"text",text:""})}</div>
</div></div>);})}
</div>
{(()=>{const cc=cards[order[cur]];if(!cc)return null;const pid=cc.pid;const opts=quizOpts[pid]||[];const solved=seen.has(pid);const wr=wrong[pid]||[];return(<div className="fc-opts"><div className="fc-opt-prompt">{solved?t.answerLabel:t.choosePrompt}</div>{opts.map((o,i)=>{const isW=wr.includes(i);const isC=solved&&o.correct;return <button key={o.key} className={`fc-opt${isC?" ok":""}${isW?" wrong":""}`} disabled={solved||isW} onClick={()=>onOption(pid,i)}>{optContent(o.side)}</button>;})}</div>);})()}
<div className="seq-nav fc-nav"><div className="fc-actbtns">
<button className="nav-prev" onClick={prevCard}>◀ {t.prev}</button>
<button className="nav-sec" onClick={shuffleCards}>🔀 {t.shuffle}</button>
<button className="nav-reset" onClick={restartCards}>↺ {t.restart}</button>
<button className="nav-next" onClick={nextCard}>{t.nextBtn} ▶</button>
</div></div>
</div></>)}
</div></>)}</div>)}
</div>
{showComp&&<div className="mo" onClick={()=>setShowComp(false)}><div className="wm" onClick={e=>e.stopPropagation()}>{showConfetti&&<Confetti/>}<div className="wi">🎓</div><h2>{t.congrats}</h2><div className="wfb">{t.greatStudy}</div><div className="wsg"><div className="ws-item"><div className="wv">{cards.length}</div><div className="wl">{t.cards}</div></div><div className="ws-item"><div className="wv">{pct}%</div><div className="wl">{t.accuracy}</div></div><div className="ws-item"><div className="wv">{fmt(tm)}</div><div className="wl">{t.timeSpent}</div></div><div className="ws-item"><div className="wv">{correctN}/{cards.length}</div><div className="wl">{t.correctLabel}</div></div>{ppw>0&&<div className="ws-item"><div className="wv">{sc}</div><div className="wl">{t.score}</div></div>}</div><button onClick={()=>{setShowComp(false);startG(false)}}>{t.playAgain}</button></div></div>}
{showE&&<div className="mo z3" onClick={()=>{setShowE(false);setES("")}}><EmojiPicker onPick={pickEmoji} onClose={()=>setShowE(false)} searchVal={eS} setSearchVal={setES}/></div>}
{didx!==null&&<div className="mo" onClick={()=>setDidx(null)}><div className="mm" onClick={e=>e.stopPropagation()}><h3 style={{color:"#e53e3e"}}>Delete Card</h3><p>Delete card <span className="hn">{didx+1}</span>?</p><div className="ma"><button className="bc" onClick={()=>setDidx(null)}>Cancel</button><button className="bd" onClick={delCard}>Delete</button></div></div></div>}
{showSv&&<div className="mo" onClick={()=>setShowSv(false)}><div className="mm" onClick={e=>e.stopPropagation()}><h3>Save Activity</h3><div className="fg"><label>Title</label><input value={svT} onChange={e=>setSvT(e.target.value)} placeholder="Activity title..."/></div><div className="fg"><label>Detail (Optional)</label><input value={svD} onChange={e=>setSvD(e.target.value)} placeholder="Brief description..."/></div><div className="ma"><button className="bc" onClick={()=>setShowSv(false)}>Cancel</button><button className="bs" onClick={doSave}>Save</button></div></div></div>}
{showLd&&<div className="mo" onClick={()=>setShowLd(false)}><div className="mm" onClick={e=>e.stopPropagation()} style={{maxWidth:440}}><h3>Load Activity</h3><div className="ll">{ldL.length===0?<div className="le">No saved activities yet.</div>:ldL.map(it=><div className="lli" key={it.id}><div className="ln"><div className="lt">{it.title}</div><div className="ld">{it.detail||""} · {new Date(it.date).toLocaleDateString()}</div></div><div className="la"><button className="lb-load" onClick={()=>ldAct(it.data)}>Load</button><button className="lb-del" onClick={()=>setDelSavId(it.id)}>Delete</button></div></div>)}</div><div className="ma"><button className="bc" onClick={()=>setShowLd(false)}>Close</button></div></div></div>}
{delSavId!==null&&<div className="mo z3" onClick={()=>setDelSavId(null)}><div className="mm" onClick={e=>e.stopPropagation()}><h3 style={{color:"#e53e3e"}}>Delete Saved Activity</h3><p>This cannot be undone. Continue?</p><div className="ma"><button className="bc" onClick={()=>setDelSavId(null)}>Cancel</button><button className="bd" onClick={confirmDelSav}>Delete</button></div></div></div>}
{showCl&&<div className="mo" onClick={()=>setShowCl(false)}><div className="mm" onClick={e=>e.stopPropagation()}><h3 style={{color:"#e53e3e"}}>Clear All</h3><p>Clear all inputs and cards? Saved decks won't be affected.</p><div className="ma"><button className="bc" onClick={()=>setShowCl(false)}>Cancel</button><button className="bd" onClick={clearAll}>Clear All</button></div></div></div>}
</div>)}
