<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Game</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--pd:#18283f;--pg:#848c99;--bg:#f0f1f5;--wh:#fff;--c1:#70f2f5;--c2:#02465c;--g1:#ffcc00;--g2:#ff6100;--mx:14px}
html,body{height:100%;font-family:'Poppins',sans-serif;background:linear-gradient(180deg,#ffffff,#e5eeff);color:var(--pd);overflow:hidden;-webkit-user-select:none;-moz-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text}
.app{width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.tw{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--wh);padding:12px 18px 12px 16px;border-radius:12px;font-size:.82rem;font-weight:600;display:flex;align-items:flex-start;gap:12px;max-width:400px;border:2px solid var(--g2);position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.1);animation:tIn .3s}
.toast::before{content:'';position:absolute;top:0;left:0;right:0;height:3.5px;background:linear-gradient(90deg,var(--g1),var(--g2))}
.toast.ok{border-color:#059669}.toast.ok::before{background:linear-gradient(90deg,#34d399,#059669)}
.toast-b{flex:1}.toast-b .t1{font-weight:700;color:var(--pd);font-size:.84rem}.toast-b .t2{font-weight:400;color:var(--pg);font-size:.75rem;margin-top:1px}
.toast-x{border:none;background:none;cursor:pointer;font-size:.9rem;color:var(--pg);padding:0;line-height:1;flex-shrink:0}.toast-x:hover{color:var(--pd)}
@keyframes tIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.hd{background:var(--wh);padding:6px var(--mx);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4e5e9;flex-shrink:0}
.hd-l{display:flex;align-items:baseline;gap:8px}
.l1{font-weight:800;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.l2{font-weight:400;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hd-r{display:flex;gap:6px}
.tb{padding:5px 18px;border-radius:7px;font-family:'Poppins',sans-serif;font-weight:700;font-size:.74rem;cursor:pointer;transition:all .2s;border:2px solid var(--c2);text-transform:uppercase;letter-spacing:.4px}
.tb.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--wh)}.tb:not(.on){background:transparent;color:var(--c2)}.tb:not(.on):hover{background:rgba(2,70,92,.04)}
.mn{flex:1;padding:var(--mx);overflow:hidden;min-height:0;display:flex;flex-direction:column}
.cr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;flex:1;min-height:0;overflow:hidden}
.bx{background:var(--wh);border-radius:14px;padding:18px;border:1px solid #e4e5e9;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.bx-s{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding-right:4px}
.bx-s::-webkit-scrollbar{width:4px}.bx-s::-webkit-scrollbar-thumb{background:#d0d2d8;border-radius:8px}
.bx h3{font-size:.92rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.sn{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fg{margin-bottom:12px;flex-shrink:0}
.fg label{display:block;font-size:.72rem;font-weight:600;color:var(--pg);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea{width:100%;padding:9px 12px;border:1.5px solid #d0d2d8;border-radius:8px;font-family:'Poppins',sans-serif;font-size:.84rem;color:var(--pd);outline:none;background:transparent;transition:border .2s}
.fg input:focus,.fg textarea:focus{border-color:var(--c1)}.fg input::placeholder,.fg textarea::placeholder{color:#b8bac0}
.fg textarea{resize:vertical;min-height:50px}
.tr{display:flex;gap:6px}.tr .fg{flex:1;margin-bottom:0}
.lr{display:flex;gap:5px}
.lb{flex:1;padding:8px;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.74rem;cursor:pointer;color:var(--wh);transition:all .2s}
.lb.on{opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.12)}.lb:not(.on){background:#d4d6db !important;color:#999;opacity:.85}
.bx-bt{flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #eee;margin-top:10px}
.ar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ab{padding:9px 4px;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer;color:var(--wh);transition:all .15s;text-align:center;position:relative}
.ab:hover{opacity:.88;transform:translateY(-1px)}
[data-tip]{position:relative}[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--pd);color:#fff;padding:6px 12px;border-radius:8px;font-size:.62rem;font-weight:500;white-space:normal;width:210px;text-align:center;z-index:60;pointer-events:none;animation:fadeIn .15s;line-height:1.4}[data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--pd);z-index:60;pointer-events:none;animation:fadeIn .15s}
.ts{display:flex;gap:5px;margin-bottom:12px;flex-shrink:0}
.tyb{flex:1;padding:8px;border:1.5px solid #d0d2d8;border-radius:8px;background:transparent;font-family:'Poppins',sans-serif;font-weight:600;font-size:.72rem;cursor:pointer;color:var(--pg);transition:all .2s}
.tyb.on{border-color:var(--pd);color:var(--pd);background:rgba(24,40,63,.04)}
.ui{width:100%;padding:9px 12px;border:1.5px solid #d0d2d8;border-radius:8px;font-family:'Poppins',sans-serif;font-size:.84rem;color:var(--pg);outline:none;background:transparent;cursor:pointer}.ui.hv{color:var(--pd)}.hf{display:none}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;flex-shrink:0;max-width:260px;margin:0 auto;padding:2px 0}
.cv{aspect-ratio:1;border-radius:6px;cursor:pointer;border:2.5px solid transparent;transition:all .15s;position:relative;overflow:hidden}
.cv:hover{transform:scale(1.06)}.cv.sel{border-color:var(--pd);box-shadow:0 0 0 1.5px #fff,0 0 0 3.5px var(--pd)}
.cv .pt{position:absolute;inset:0}
.pt-d{background-image:radial-gradient(circle,rgba(255,255,255,.28) 1.5px,transparent 1.5px);background-size:7px 7px}
.pt-s{background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(255,255,255,.22) 3px,rgba(255,255,255,.22) 6px)}
.pt-z{background-image:linear-gradient(135deg,rgba(255,255,255,.2) 25%,transparent 25%),linear-gradient(225deg,rgba(255,255,255,.2) 25%,transparent 25%),linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%),linear-gradient(315deg,rgba(255,255,255,.2) 25%,transparent 25%);background-size:8px 8px;background-position:4px 0,4px 0,0 0,0 0}
.pt-g{background-image:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);background-size:7px 7px}
.pt-c{background-image:radial-gradient(circle,rgba(255,255,255,.24) 1px,transparent 1px),radial-gradient(circle,rgba(255,255,255,.24) 1px,transparent 1px);background-size:9px 9px;background-position:0 0,4.5px 4.5px}
.pvs{flex-shrink:0;margin:14px 0 6px}
.pvl{font-size:.72rem;font-weight:600;color:var(--pg);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;text-align:left}
.pvr{display:flex;gap:18px;justify-content:center}
.pvw{text-align:center}
.pvc{width:125px;height:125px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex-shrink:0}
.pvcl{font-size:.62rem;color:var(--pg);margin-top:6px;font-weight:500}
.pv-cv{color:rgba(255,255,255,.45);font-size:2.2rem;font-weight:700}.pv-cv .pt{position:absolute;inset:0}
.pv-ct{background:var(--wh);border:1.5px solid #e4e5e9}
.pv-ct .xt{font-size:.88rem;font-weight:600;color:var(--pd);text-align:center;padding:10px;word-break:break-word;line-height:1.3}
.pv-ct .xe{font-size:3rem}.pv-ct .xi{max-width:90%;max-height:88%;object-fit:contain;border-radius:6px}.pv-ct .xn{font-size:.68rem;color:#c0c2c8}
.cl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:3px;min-height:0}
.cl::-webkit-scrollbar{width:4px}.cl::-webkit-scrollbar-thumb{background:#d0d2d8;border-radius:8px}
.ci{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--bg);border-radius:9px;font-size:.8rem;flex-shrink:0}.ci:hover{background:#e4e5e9}
.ci .ct{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}.ci .ct .pt{position:absolute;inset:0}
.ci .cn{flex:1;min-width:0;font-weight:600;color:var(--pd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
.ci .ca{display:flex;gap:4px;flex-shrink:0}
.ab2{border:none;border-radius:6px;cursor:pointer;font-size:.66rem;font-family:'Poppins',sans-serif;font-weight:600;padding:5px 11px;transition:all .12s}
.ab2.ed{background:rgba(112,242,245,.15);color:var(--c2)}.ab2.ed:hover{background:rgba(112,242,245,.3)}
.ab2.dl{background:rgba(229,62,62,.1);color:#e53e3e}.ab2.dl:hover{background:rgba(229,62,62,.2)}
.es{text-align:center;padding:24px 8px;color:var(--pg);font-size:.78rem}.es .ei{font-size:1.8rem;margin-bottom:5px;opacity:.35}
.cc{font-size:.66rem;color:var(--pg);font-weight:500;margin-left:auto}
.btn-p{width:100%;padding:10px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:.88rem;cursor:pointer;flex-shrink:0;transition:opacity .2s}.btn-p:hover{opacity:.88}.btn-p:disabled{opacity:.3;cursor:not-allowed}

/* PLAY */
.pp{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.pb{background:linear-gradient(180deg,#e8e9ed,#d8d9dd);border-radius:12px 12px 0 0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pb-l{display:flex;flex-direction:column;gap:1px}.pb-l .p-t{font-size:1.05rem;font-weight:800}.pb-l .p-d{font-size:.72rem;color:var(--pg)}
.pb-r{display:flex;gap:18px;align-items:flex-end}
.ps{text-align:center;min-width:52px}.ps .pl{font-size:.56rem;color:var(--pg);text-transform:uppercase;letter-spacing:.4px;font-weight:600}.ps .pv{font-size:1.5rem;font-weight:800;color:var(--pd);line-height:1.1;font-variant-numeric:tabular-nums}
.ptm{text-align:center;min-width:70px}.ptm .pl{font-size:.56rem;color:var(--pg);text-transform:uppercase;letter-spacing:.4px;font-weight:600}.ptm .pv{font-size:1.8rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.tg{color:#22c55e}.ty{color:#eab308}.tre{color:#ef4444}
.prg{height:4px;flex-shrink:0;background:#e0e0e0}.prg-f{height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .4s}
.ga{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px;overflow:hidden;background:#ffffff;border-radius:0 0 12px 12px;border:1px solid #e4e5e9;border-top:none;min-height:0;position:relative}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.particle{position:absolute;border-radius:50%;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{0%{opacity:0;transform:translateY(100%) scale(.5)}10%{opacity:.09}50%{opacity:.06}100%{opacity:0;transform:translateY(-120vh) scale(1)}}

/* GAME GRID — position:relative cells, absolutely-positioned card inners */
.gg-wrap{display:flex;align-items:center;justify-content:center;flex:1;width:100%;min-height:0;position:relative;z-index:1}
.gg{display:inline-grid;gap:10px}
/* Each cell is a positioned container with fixed dimensions */
.gc{position:relative;overflow:visible}
/* The flippable card fills the cell exactly */
.gc-inner{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer}
.gc.flipped .gc-inner,.gc.matched .gc-inner{transform:rotateY(180deg)}
.gc-front,.gc-back{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gc-front{border:2px solid rgba(0,0,0,.08);color:rgba(255,255,255,.45);font-weight:700}.gc-front .pt{position:absolute;inset:0}
.gc-back{background:var(--wh);border:2px solid #dde0e6;transform:rotateY(180deg);padding:4px}
.gc-back .card-content{display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-align:center;font-weight:600;color:var(--pd);word-break:break-word;overflow:hidden}
.gc-back .card-content img{max-width:92%;max-height:92%;object-fit:contain;border-radius:5px;display:block}
.gc.matched .gc-back{border-color:var(--g1);background:linear-gradient(135deg,rgba(251,175,1,.06),rgba(255,204,0,.06))}
.gc.matched{pointer-events:none}
.gc.placeholder{visibility:hidden;pointer-events:none}

.btn-rs{padding:9px 28px;border:none;border-radius:9px;background:linear-gradient(135deg,#faad91,#ff1111);color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:.84rem;cursor:pointer;margin-top:14px;transition:opacity .2s;flex-shrink:0;display:flex;align-items:center;gap:6px;z-index:2}.btn-rs:hover{opacity:.88}.btn-rs svg{width:16px;height:16px}
.nc{text-align:center;padding:40px;color:var(--pg);margin:auto;z-index:2}.nc .ni{font-size:2.5rem;margin-bottom:8px;opacity:.3}.nc p{font-size:.85rem}.nc .nh{font-size:.72rem;margin-top:5px}

.mo{position:fixed;inset:0;background:rgba(24,40,63,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s}.mo.z3{z-index:300}
.mm{background:var(--wh);border-radius:16px;padding:26px;max-width:400px;width:92%;animation:scaleIn .25s cubic-bezier(.2,.8,.3,1)}
.mm h3{font-size:.95rem;font-weight:700;margin-bottom:14px}.mm p{font-size:.82rem;color:var(--pg);margin-bottom:14px;line-height:1.5}.mm .hn{font-weight:700;color:var(--pd)}
.ma{display:flex;gap:8px;margin-top:14px}.ma button{flex:1;padding:9px;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;transition:all .12s}
.bc{border:1.5px solid #d0d2d8;background:transparent;color:var(--pg)}.bc:hover{background:var(--bg)}.bs{border:none;background:var(--pd);color:#fff}.bs:hover{opacity:.9}.bd{border:none;background:#e53e3e;color:#fff}.bd:hover{opacity:.9}
.wm{background:var(--wh);border-radius:20px;padding:34px 30px;text-align:center;max-width:400px;width:92%;animation:scaleIn .3s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden}
.wm .wi{font-size:2.8rem;margin-bottom:6px;position:relative;z-index:2}.wm h2{font-size:1.25rem;font-weight:800;margin-bottom:4px;position:relative;z-index:2}
.wm .wfb{font-size:.8rem;color:var(--pg);margin:4px 0 16px;font-style:italic;position:relative;z-index:2}
.wm .wsg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;position:relative;z-index:2}
.wm .ws-item{background:var(--bg);border-radius:10px;padding:10px 8px}.wm .ws-item .wv{font-size:1.35rem;font-weight:800;color:var(--g2);line-height:1.2}.wm .ws-item .wl{font-size:.6rem;color:var(--pg);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.wm button{padding:10px 30px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:.88rem;cursor:pointer;position:relative;z-index:2}.wm button:hover{opacity:.88}
.confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.confetti-piece{position:absolute;top:-10px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}100%{opacity:0;transform:translateY(450px) rotate(720deg) scale(.5)}}
.em{background:var(--wh);border-radius:16px;padding:22px;max-width:580px;width:96%;max-height:78vh;display:flex;flex-direction:column;animation:scaleIn .2s cubic-bezier(.2,.8,.3,1)}
.em h3{font-size:.95rem;font-weight:700;margin-bottom:10px}
.ems{width:100%;padding:9px 12px;border:1.5px solid #d0d2d8;border-radius:8px;font-family:'Poppins',sans-serif;font-size:.82rem;margin-bottom:10px;outline:none;background:transparent;flex-shrink:0}.ems:focus{border-color:var(--c1)}
.emg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;overflow-y:auto;overflow-x:hidden;padding:4px;flex:1;min-height:0}
.emg::-webkit-scrollbar{width:5px}.emg::-webkit-scrollbar-thumb{background:#d0d2d8;border-radius:8px}
.emb{border:none;border-radius:8px;background:var(--bg);font-size:1.5rem;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;height:44px;line-height:1;overflow:hidden}.emb:hover{background:#dce0ea;transform:scale(1.06)}
.emc{margin-top:10px;width:100%;padding:8px;border:1.5px solid #d0d2d8;border-radius:8px;background:transparent;font-family:'Poppins',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--pg);flex-shrink:0}
.ll{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.ll::-webkit-scrollbar{width:4px}.ll::-webkit-scrollbar-thumb{background:#d0d2d8;border-radius:8px}
.lli{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-radius:9px;transition:all .12s}
.lli .ln{flex:1;min-width:0}.lli .ln .lt{font-weight:600;font-size:.82rem;color:var(--pd)}.lli .ln .ld{font-size:.66rem;color:var(--pg)}
.lli .la{display:flex;gap:4px;flex-shrink:0}.lli .la button{border:none;border-radius:6px;padding:5px 10px;font-size:.64rem;font-family:'Poppins',sans-serif;font-weight:600;cursor:pointer}
.lli .la .lb-load{background:rgba(112,242,245,.15);color:var(--c2)}.lli .la .lb-load:hover{background:rgba(112,242,245,.3)}
.lli .la .lb-del{background:rgba(229,62,62,.1);color:#e53e3e}.lli .la .lb-del:hover{background:rgba(229,62,62,.2)}
.le{text-align:center;padding:24px;color:var(--pg);font-size:.78rem}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@media(max-width:960px){.cr{grid-template-columns:1fr;gap:8px;overflow-y:auto}.bx{min-height:auto;max-height:none;overflow:visible}}
@media(max-width:600px){:root{--mx:8px}.l1{font-size:1.05rem}.l2{font-size:.9rem}.tb{padding:4px 12px;font-size:.7rem}}
/* emoji category tabs (added to match latest picker, early-version styling) */
.emo-cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;flex-shrink:0}
.emo-cat{padding:5px 10px;border:1.5px solid #d0d2d8;border-radius:8px;background:transparent;font-size:.9rem;cursor:pointer;transition:all .12s;font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:3px}
.emo-cat span.cat-label{font-size:.58rem;font-weight:600;color:var(--pg)}
.emo-cat:hover{border-color:#b9bcc4}
.emo-cat.on{background:rgba(24,40,63,.04);border-color:var(--pd)}
.emo-cat.on span.cat-label{color:var(--pd)}

/* —— gameplay juice: combo + sound + match/miss feedback (in-theme) —— */
.snd-tg{position:absolute;top:12px;right:14px;z-index:3;width:34px;height:34px;border:1.5px solid #e4e5e9;border-radius:9px;background:rgba(255,255,255,.85);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.snd-tg:hover{border-color:var(--c1);transform:translateY(-1px)}
.snd-tg:active{transform:scale(.94)}

.sg-item-img{width:62px;height:62px;object-fit:cover;border-radius:8px;display:block;pointer-events:none}
.sg-item-txt{pointer-events:none;line-height:1.2;text-align:center;max-width:150px;word-break:break-word}
.sg-item.dragging{opacity:.3;pointer-events:none}
.sg-item.pressing{transform:scale(.92)}
.sg-item.ok{border-color:#4ade80;background:linear-gradient(135deg,#eafff2,#e2fff0);cursor:default}
.sg-item.wrong{border-color:#fb7185;background:linear-gradient(135deg,#fff1f3,#ffe6ea);animation:seqShake .4s}
.sg-float{position:fixed;z-index:9999;pointer-events:none;border-color:var(--c1)!important;box-shadow:0 20px 42px rgba(2,70,92,.32);transform:rotate(-2deg) scale(1.06);opacity:.98;background:#fff}
.em{background:var(--wh);border-radius:16px;padding:22px;max-width:580px;width:96%;max-height:78vh;display:flex;flex-direction:column;animation:scaleIn .2s cubic-bezier(.2,.8,.3,1)}
.em h3{font-size:.95rem;font-weight:700;margin-bottom:10px}
.ems{width:100%;padding:9px 12px;border:1.5px solid #d0d2d8;border-radius:8px;font-family:'Poppins',sans-serif;font-size:.82rem;margin-bottom:10px;outline:none;background:transparent;flex-shrink:0}
.ems:focus{border-color:var(--c1)}
.emo-cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;flex-shrink:0}
.emo-cat{padding:5px 10px;border:1.5px solid #d0d2d8;border-radius:8px;background:transparent;font-size:.9rem;cursor:pointer;transition:all .12s;font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:3px}
.emo-cat.on{background:rgba(24,40,63,.04);border-color:var(--pd)}
.emo-cat:hover{border-color:#b9bcc4}
.emo-cat span.cat-label{font-size:.58rem;font-weight:600;color:var(--pg)}
.emg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;overflow-y:auto;overflow-x:hidden;padding:4px;flex:1;min-height:0}
.emb{border:none;border-radius:8px;background:var(--bg);font-size:1.5rem;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;height:44px;line-height:1;overflow:hidden}
.emb:hover{background:#dce0ea;transform:scale(1.06)}
.emc{margin-top:10px;width:100%;padding:8px;border:1.5px solid #d0d2d8;border-radius:8px;background:transparent;font-family:'Poppins',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--pg);flex-shrink:0}
.mo.z3{z-index:300}
@media(max-width:560px){.emg{grid-template-columns:repeat(8,1fr)}}
.sg-continue{background:linear-gradient(135deg,#34d399,#059669)!important;box-shadow:0 5px 16px rgba(5,150,105,.28)!important;padding:12px 26px!important;font-size:.9rem!important}

const onCardCancel=(e)=>{setPressI(-1);if(draggingRef.current){draggingRef.current=false;setDragging(false);dragIRef.current=null;setDragI(null);hoverBinRef.current=null;setHoverBin(null);}startRef.current=null;};

/* drag (pointer = mouse + touch) */
const onMove=(e)=>{const d=dragRef.current;if(!d)return;e.preventDefault();const floatLeft=e.clientX-d.rowLeft-d.grabDX;let tgt=Math.round(floatLeft/d.tileW);tgt=Math.max(0,Math.min(lenRef.current-1,tgt));if(tgt!==d.idx){const from=d.idx;setGame(g=>{const ng=g.map(x=>({...x,letters:x.letters.slice()}));const arr=ng[wiRef.current].letters;const[it]=arr.splice(from,1);arr.splice(tgt,0,it);return ng});d.idx=tgt}const dx=floatLeft-d.idx*d.tileW;setDrag({id:d.id,idx:d.idx,dx})};

const onTileDown=(e,i)=>{const w=gameRef.current[wiRef.current];if(!w||w.solved)return;const row=rowRef.current;if(!row)return;const tiles=[...row.querySelectorAll(".jt")];const el=tiles[i];if(!el)return;const r=el.getBoundingClientRect();let tileW=r.width+10;if(tiles.length>1){const a=tiles[0].getBoundingClientRect(),b=tiles[1].getBoundingClientRect();tileW=b.left-a.left}const grabDX=e.clientX-r.left;dragRef.current={id:w.letters[i].id,idx:i,grabDX,tileW,rowLeft:row.getBoundingClientRect().left};setDrag({id:w.letters[i].id,idx:i,dx:0});sPick();try{el.setPointerCapture&&el.releasePointerCapture&&el.releasePointerCapture(e.pointerId)}catch(_){}window.addEventListener("pointermove",onMove,{passive:false});window.addEventListener("pointerup",onUp);e.preventDefault()};

const total=game.length;

  const b=new Blob([dataStr],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=suggested;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("File Saved ✓","Activity downloaded as .isg file.","ok");

return(
<div className="app" onContextMenu={e=>e.preventDefault()}>
<div className="tw">{toasts.map(x=><div key={x.id} className={`toast ${x.tp==="ok"?"ok":""}`}><div className="toast-b"><div className="t1">{x.m}</div>{x.s&&<div className="t2">{x.s}</div>}</div><button className="toast-x" onClick={()=>kT(x.id)}>✕</button></div>)}</div>
<header className="hd"><div className="hd-l"><span className="l1">SORTING</span><span className="l2">GAME</span></div><div className="hd-r"><button className={`tb ${tab==="create"?"on":""}`} onClick={()=>setTab("create")}>Create</button><button className={`tb ${tab==="play"?"on":""}`} onClick={()=>setTab("play")}>Play</button></div></header>
<div className="mn">
{tab==="create"?(<div className="cr">
<div className="bx"><div className="bx-s">
<h3><span className="sn">1</span>Activity Setup</h3>
<div className="fg"><label>Activity Title</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Enter activity title..."/></div>
<div className="fg"><label>Directions</label><textarea value={dirs} onChange={e=>setDirs(e.target.value)} placeholder="Enter directions..."/></div>
<div className="fg"><label>Time Limit (Optional)</label><div className="tr"><div className="fg"><input type="number" min="0" max="59" value={tmn} onChange={e=>setTmn(e.target.value)} placeholder="Min"/></div><div className="fg"><input type="number" min="0" max="59" value={tsc} onChange={e=>setTsc(e.target.value)} placeholder="Sec"/></div></div></div>
<div className="fg"><label>Points per correct placement (Optional)</label><input type="number" min="0" value={pts} onChange={e=>setPts(e.target.value)} placeholder="e.g. 10"/></div>
<div className="fg"><label>Language</label><div className="lr"><button className={`lb ${lang==="en"?"on":""}`} style={lang==="en"?{background:"linear-gradient(135deg,#a5d3fc,#2a98fa)"}:{}} onClick={()=>setLang("en")}>🇺🇸 English</button><button className={`lb ${lang==="fil"?"on":""}`} style={lang==="fil"?{background:"linear-gradient(135deg,#a5d3fc,#2a98fa)"}:{}} onClick={()=>setLang("fil")}>🇵🇭 Filipino</button></div></div>
</div><div className="bx-bt">
<div className="ar"><button className="ab" style={{background:"linear-gradient(135deg,#90fffb,#00ada6)"}} data-tip={fileHandle?`Save changes to ${fileName}`:"Save your work as a file on your computer to share, edit, or play later."} onClick={saveFile}>{saveBtnLabel()}</button><button className="ab" style={{background:"linear-gradient(135deg,#9bc1ff,#0751cb)"}} data-tip="Open an activity file you previously saved on this computer." onClick={openFile}>📂 Open File</button></div>
<div className="ar"><button className="ab" style={{background:"linear-gradient(135deg,#cab3e9,#842efa)"}} data-tip="Quickly save your progress inside InterACT so you can continue later." onClick={()=>{setSvT(title);setShowSv(true)}}>📥 Save Activity</button><button className="ab" style={{background:"linear-gradient(135deg,#73ff67,#00b322)"}} data-tip="Restore an activity you saved inside InterACT." onClick={oLoad}>📤 Load Activity</button></div>
<button className="ab" style={{background:"linear-gradient(135deg,#faad91,#ff1111)",width:"100%"}} onClick={()=>setShowCl(true)}>🗑 Clear All</button>
</div></div>
<div className="bx"><div className="bx-s">
<h3><span className="sn">2</span>Groups</h3>
<div className="fg"><label>Category Name</label><div className="sg-grow"><input value={gName} onChange={e=>setGName(e.target.value)} placeholder="e.g. Living" onKeyDown={e=>{if(e.key==="Enter")addGroup()}}/><button className="sg-addg" onClick={addGroup}>+ Add</button></div></div>
<div className="sg-glist">{groups.length===0?<span className="sg-gempty">No groups yet — add at least two.</span>:groups.map((g,gi)=><span key={g} className="sg-gchip"><span className="sg-gdot" style={{background:GCOL[gi%GCOL.length]}}></span>{g}<button className="sg-gx" onClick={()=>delGroup(g)} title="Remove group">✕</button></span>)}</div>
<h3 style={{marginTop:16}}><span className="sn">3</span>{eStep>=0?("Edit Item "+(eStep+1)):"Add an Item"}</h3>
<div className="fg"><label>Picture (optional)</label>
<div className="sg-vis"><div className="seq-up sg-up-sm" onClick={()=>{if(!stepImg)document.getElementById("seqfile").click()}}>{stepImg?<><img src={stepImg} alt=""/><button className="seq-up-x" onClick={e=>{e.stopPropagation();clearStepImg()}}>✕</button></>:<span className="seq-up-ph">＋ Image</span>}</div><div className="sg-emobox" onClick={()=>setShowEmo(v=>!v)}>{stepEmoji?<><span className="sg-emo-big">{stepEmoji}</span><button className="seq-up-x" onClick={e=>{e.stopPropagation();setStepEmoji("")}}>✕</button></>:<span className="seq-up-ph">😀 Emoji</span>}</div></div>
<input id="seqfile" type="file" accept="image/*" style={{display:"none"}} onChange={onStepImg}/></div>
<div className="fg"><label>Label / Text {stepImg?"(optional)":""}</label><input value={stepTxt} onChange={e=>setStepTxt(e.target.value)} placeholder="e.g. Dog" onKeyDown={e=>{if(e.key==="Enter"){eStep>=0?saveStep():addItem()}}}/></div>
<div className="fg"><label>Belongs to Group</label><select className="sg-sel" value={itemCat} onChange={e=>setItemCat(e.target.value)}><option value="">{groups.length?"— Select group —":"— add a group first —"}</option>{groups.map(g=><option key={g} value={g}>{g}</option>)}</select></div>
<div className="fg"><label>Bulk Add (Category: item1, item2, …)</label><textarea className="jw-bulk" value={bulk} onChange={e=>setBulk(e.target.value)} placeholder={"One group per line:\nLiving: dog, tree, fish\nNon-living: rock, chair, cup"}/></div>
<button className="ab" style={{background:"linear-gradient(135deg,#9bc1ff,#0751cb)",width:"100%",marginBottom:"2px"}} disabled={!bulk.trim()} onClick={addBulk}>📋 Add All from List</button>
</div><div className="bx-bt">{eStep>=0?<div style={{display:"flex",gap:"8px",width:"100%"}}><button className="ab" style={{background:"linear-gradient(135deg,#34d399,#059669)",flex:"1"}} onClick={saveStep}>✓ Update Item</button><button className="ab2" style={{flex:"0 0 auto",padding:"0 18px"}} onClick={cancelEdit}>Cancel</button></div>:<button className="ab" style={{background:"linear-gradient(135deg,var(--c1),var(--c2))",width:"100%"}} onClick={addItem}>+ Add Item</button>}</div></div>
<div className="bx">
<h3><span className="sn">4</span>Items<button className="mask-tg" onClick={()=>setMaskWords(m=>!m)} title={maskWords?"Show groups":"Hide groups"}>{maskWords?"🙈 Hidden":"👁️ Shown"}</button><span className="cc" style={{marginLeft:8}}>{words.length}/30</span></h3>
<div className="cl">{words.length===0?<div className="es"><div className="ei">🗂️</div><p>No items yet.<br/>Add items and assign each to a group!</p></div>:words.map((w,i)=><div className={`ci seq-ci${eStep===i?" editing":""}`} key={i}><div className="ct seq-ct">{w.img?<img src={w.img} alt=""/>:w.emoji?<span className="sg-emo-t">{w.emoji}</span>:<span>{((w.text&&w.text[0])||"?").toUpperCase()}</span>}</div><div className="cn jw-cn"><div className="jw-cn-w">{w.text||"(image)"}</div><div className="sg-itemcat">{maskWords?"🙈 Hidden":w.cat}</div></div><div className="ca seq-ca"><button className="seq-mv seq-edit" onClick={()=>startEditStep(i)} title="Edit item">✏️</button><button className="ab2 dl" onClick={()=>setDidx(i)}>✕</button></div></div>)}</div>
<div className="bx-bt"><button className="btn-p" onClick={playFC} disabled={groups.length<2||words.length<1}>▶ Play Activity</button></div>
</div></div>):
(<div className="pp">{words.length<1?<div className="nc"><div className="ni">🔤</div><p>No words to play with yet!</p><p className="nh">Switch to <strong>CREATE</strong> and add at least one word.</p></div>:(
<><div className="pb"><div className="pb-l"><div className="p-t">{title}</div><div className="p-d">{dirs}</div></div>
<div className="pb-r">
<div className="ps"><div className="pl">{t.solved}</div><div className="pv">{solvedCount}/{total||words.length}</div></div>
{ppw>0&&<div className="ps"><div className="pl">{t.score}</div><div className="pv">{sc}</div></div>}
{hasTL&&<div className="ptm"><div className="pl">{t.timeLeft}</div><div className={`pv ${tmCls()}`}>{fmt(rem)}</div></div>}
</div></div>
<div className="prg"><div className="prg-f" style={{width:`${prog}%`}}/></div>
<div className="ga" ref={gaRef}><Particles/><button className="snd-tg" onClick={()=>setMuted(m=>!m)} title={muted?"Sound off":"Sound on"}>{muted?"🔇":"🔊"}</button>
{game.length===0?<button className="btn-rs" onClick={startG} style={{background:"linear-gradient(135deg,var(--c1),var(--c2))",fontSize:".92rem",padding:"12px 42px",zIndex:2}}>🎮 {t.start}</button>:(
<><div className="sg-area">
<div className="sg-scroll">
<div className="seq-top"><div className="jw-count">{t.seqTip}</div></div>
<div className="sg-pool" data-pool="1">{game.some(it=>it.placed===null)?game.map((it,i)=>it.placed===null?itemCard(it,i):null):<span className="sg-poolempty">{t.allPlaced} ✓</span>}</div>
<div className="sg-bins">{groups.map((g,gi)=>{const isHover=hoverBin===g;return <div key={g} data-bin={g} className={`sg-bin${isHover?" hover":""}`} style={{"--bc":GCOL[gi%GCOL.length]}}><div className="sg-binh">{g}</div><div className="sg-bindrop">{game.map((it,i)=>it.placed===g?itemCard(it,i):null)}</div></div>;})}</div>
<div className={`jw-fb ${fb?(fb.type==="ok"?"ok":"no"):""}`}>{fb?fb.msg:""}</div>
</div>
<div className="seq-nav sg-nav">
{reviewW?<><button className="nav-check sg-continue" onClick={()=>{setReviewW(false);setFb(null)}}>▶ {t.continueBtn}</button><button className="nav-reset sg-tryagain" onClick={startG}>↻ {t.tryAgain}</button></>:<><button className="nav-check" onClick={checkSort} disabled={lockS}>✓ {t.check}</button><button className="nav-sec" onClick={revealSort} disabled={lockS}>💡 {t.reveal}</button><button className="nav-reset" onClick={startG}><RSvg/>{t.reset}</button></>}
</div></div>
{dragging&&dragI!=null&&game[dragI]?ReactDOM.createPortal(<div className={`sg-item sg-float ${game[dragI].img?"has-img":game[dragI].emoji?"has-emo":"txt-only"}`} style={{left:fpos.x+"px",top:fpos.y+"px",width:cardWHRef.current.w+"px"}}>{game[dragI].img?<img className="sg-item-img" src={game[dragI].img} alt=""/>:game[dragI].emoji?<span className="sg-item-emo">{game[dragI].emoji}</span>:null}{game[dragI].text?<span className="sg-item-txt">{game[dragI].text}</span>:null}</div>,document.body):null}
</>)}
</div></>)}</div>)}
</div>
{showEmo&&<div className="mo z3" onClick={()=>{setShowEmo(false);setEmoQ("")}}><EmojiPicker onPick={(em)=>{setStepEmoji(em);setStepImg("");setShowEmo(false);setEmoQ("")}} onClose={()=>setShowEmo(false)} searchVal={emoQ} setSearchVal={setEmoQ}/></div>}
{showComp&&<div className="mo" onClick={()=>setShowComp(false)}><div className="wm" onClick={e=>e.stopPropagation()}>{showConfetti&&<Confetti/>}<div className="wi">{compWin?"🏆":"⏰"}</div><h2 style={compWin?{}:{color:"#e53e3e"}}>{compWin?t.congrats:t.timeUp}</h2><div className="wfb">{getFb(compWin)}</div><div className="wsg"><div className="ws-item"><div className="wv">{finalSc}</div><div className="wl">{t.finalScore}</div></div><div className="ws-item"><div className="wv">{pct}%</div><div className="wl">{t.percentage}</div></div><div className="ws-item"><div className="wv">{fmt(tm)}</div><div className="wl">{t.timeSpent}</div></div><div className="ws-item"><div className="wv">{solvedCount}/{total}</div><div className="wl">{t.wordsSolved}</div></div></div><button onClick={()=>{setShowComp(false);startG()}}>{compWin?t.playAgain:t.tryAgain}</button></div></div>}
{editIdx!==null&&<div className="mo" onClick={()=>setEditIdx(null)}><div className="mm" onClick={e=>e.stopPropagation()}><h3>Edit Word</h3><div className="fg"><label>Word</label><input value={edata.word||""} onChange={e=>setEdata({...edata,word:e.target.value})}/></div><div className="fg"><label>Hint / Clue (Optional)</label><input value={edata.hint||""} onChange={e=>setEdata({...edata,hint:e.target.value})}/></div><div className="ma"><button className="bc" onClick={()=>setEditIdx(null)}>Cancel</button><button className="bs" onClick={sEdit}>Save</button></div></div></div>}
{didx!==null&&<div className="mo" onClick={()=>setDidx(null)}><div className="mm" onClick={e=>e.stopPropagation()}><h3 style={{color:"#e53e3e"}}>Delete Word</h3><p>Delete <span className="hn">{words[didx]?.word}</span>?</p><div className="ma"><button className="bc" onClick={()=>setDidx(null)}>Cancel</button><button className="bd" onClick={wDel}>Delete</button></div></div></div>}
{showSv&&<div className="mo" onClick={()=>setShowSv(false)}><div className="mm" onClick={e=>e.stopPropagation()}><h3>Save Activity</h3><div className="fg"><label>Title</label><input value={svT} onChange={e=>setSvT(e.target.value)} placeholder="Activity title..."/></div><div className="fg"><label>Detail (Optional)</label><input value={svD} onChange={e=>setSvD(e.target.value)} placeholder="Brief description..."/></div><div className="ma"><button className="bc" onClick={()=>setShowSv(false)}>Cancel</button><button className="bs" onClick={doSave}>Save</button></div></div></div>}
{showLd&&<div className="mo" onClick={()=>setShowLd(false)}><div className="mm" onClick={e=>e.stopPropagation()} style={{maxWidth:440}}><h3>Load Activity</h3><div className="ll">{ldL.length===0?<div className="le">No saved activities yet.</div>:ldL.map(it=><div className="lli" key={it.id}><div className="ln"><div className="lt">{it.title}</div><div className="ld">{it.detail||""} · {new Date(it.date).toLocaleDateString()}</div></div><div className="la"><button className="lb-load" onClick={()=>ldAct(it.data)}>Load</button><button className="lb-del" onClick={()=>setDelSavId(it.id)}>Delete</button></div></div>)}</div><div className="ma"><button className="bc" onClick={()=>setShowLd(false)}>Close</button></div></div></div>}
{delSavId!==null&&<div className="mo z3" onClick={()=>setDelSavId(null)}><div className="mm" onClick={e=>e.stopPropagation()}><h3 style={{color:"#e53e3e"}}>Delete Saved Activity</h3><p>This cannot be undone. Continue?</p><div className="ma"><button className="bc" onClick={()=>setDelSavId(null)}>Cancel</button><button className="bd" onClick={confirmDelSav}>Delete</button></div></div></div>}
{showCl&&<div className="mo" onClick={()=>setShowCl(false)}><div className="mm" onClick={e=>e.stopPropagation()}><h3 style={{color:"#e53e3e"}}>Clear All</h3><p>Clear all inputs and words? Saved activities won't be affected.</p><div className="ma"><button className="bc" onClick={()=>setShowCl(false)}>Cancel</button><button className="bd" onClick={clearAll}>Clear All</button></div></div></div>}
</div>)}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
